# Local development against PostgreSQL and Keycloak. Activate with: SPRING_PROFILES_ACTIVE=local
# The portal uses its own schema "vcrd" in the same database, so its migrations never touch other apps' tables.
server:
  port: 8026
  servlet:
    context-path: /vimp-srvc

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onm?currentSchema=vcrd}
    username: ${DB_USERNAME:AA105206}
    password: ${DB_PASSWORD:}
    hikari:
      # Must be > 2: a request can hold a second connection briefly (first-login user provisioning),
      # and the background jobs need their own.
      maximum-pool-size: 10
  flyway:
    schemas: vcrd
    default-schema: vcrd
    create-schemas: true
  jpa:
    properties:
      hibernate.default_schema: vcrd
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

logging:
  level:
    org.hibernate.SQL: DEBUG

vimp:
  auth:
    # Built-in login until the VIMP Keycloak client exists; then set VIMP_AUTH_MODE=keycloak.
    mode: ${VIMP_AUTH_MODE:${VCRD_AUTH_MODE:local}}
  storage:
    root: ${VIMP_STORAGE_ROOT:${VCRD_STORAGE_ROOT:D:/Energxiq_source_code/vcrd-documents}}
  ocr:
    tessdata-path: ${VIMP_TESSDATA_PATH:${VCRD_TESSDATA_PATH:}}
  malware:
    mode: ${VIMP_MALWARE_MODE:${VCRD_MALWARE_MODE:disabled}}

keycloak:
  realm: isolarsight
  auth-server-url: https://jakson.energxiq.com/auth
  resource: ${KEYCLOAK_CLIENT_ID:vimp}
  credentials:
    secret: ${KEYCLOAK_SECRET:}
  bearer-only: true
  use-resource-role-mappings: true
  # Temporary: map Keycloak client roles to VIMP roles until the real roles exist ("KC_ROLE=APP_ROLE,...").
  role-aliases: ${KEYCLOAK_ROLE_ALIASES:DEVELOPER=PORTAL_ADMIN}
