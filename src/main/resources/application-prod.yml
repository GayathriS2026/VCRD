# Production. Activate with: SPRING_PROFILES_ACTIVE=prod
# Secrets are NEVER stored here. Required environment variables:
#   DB_PASSWORD, VIMP_JWT_SECRET (built-in login, min 32 chars)
#   KEYCLOAK_SECRET once VIMP_AUTH_MODE=keycloak; CLAMAV_HOST if clamd is not on this machine
# The portal uses its own schema "vimp" in solardb, so its migrations never touch the onm schema.
server:
  port: ${SERVER_PORT:8026}
  servlet:
    context-path: /vimp-srvc

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://10.3.0.49:5432/solardb?currentSchema=vimp}
    username: ${DB_USERNAME:solardb}
    password: ${DB_PASSWORD}
    hikari:
      # Must be > 2: a request can hold a second connection briefly (first-login user provisioning),
      # and the background jobs need their own.
      maximum-pool-size: 10
  flyway:
    schemas: vimp
    default-schema: vimp
    create-schemas: true
  jpa:
    properties:
      hibernate.default_schema: vimp
  h2:
    console:
      enabled: false

logging:
  file:
    name: /opt/ipredict/vimp/application.log
  level:
    org.hibernate.SQL: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

vimp:
  auth:
    # Built-in login until the VIMP Keycloak client exists; then set VIMP_AUTH_MODE=keycloak.
    mode: ${VIMP_AUTH_MODE:${VCRD_AUTH_MODE:local}}
  jwt:
    secret: ${VIMP_JWT_SECRET:${VCRD_JWT_SECRET}}
  # Demo users have a password published in the code: only for a first trial, never with real data.
  demo-users:
    enabled: ${VIMP_DEMO_USERS:${VCRD_DEMO_USERS:false}}
  storage:
    root: ${VIMP_STORAGE_ROOT:${VCRD_STORAGE_ROOT:/opt/ipredict/vcrd/documents}}
  ocr:
    tessdata-path: ${VIMP_TESSDATA_PATH:${VCRD_TESSDATA_PATH:/opt/ipredict/vcrd/tessdata}}
  malware:
    mode: clamav
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}

keycloak:
  realm: isolarsight
  auth-server-url: https://jakson.energxiq.com/auth
  resource: ${KEYCLOAK_CLIENT_ID:vimp}
  credentials:
    secret: ${KEYCLOAK_SECRET:}
  bearer-only: true
  use-resource-role-mappings: true
  # Temporary: map Keycloak client roles to VIMP roles until the real roles exist ("KC_ROLE=APP_ROLE,...").
  role-aliases: ${KEYCLOAK_ROLE_ALIASES:}
