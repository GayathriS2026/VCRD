spring:
  application:
    name: vimp-backend
  profiles:
    active: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

keycloak:
  realm: isolarsight
  auth-server-url: https://jakson.energxiq.com/auth
  resource: ${KEYCLOAK_CLIENT_ID:vimp}
  # Not needed to validate bearer tokens (signatures are checked against Keycloak's public keys).
  # Kept for calls that act as the client itself, e.g. token introspection or the admin API.
  credentials:
    secret: ${KEYCLOAK_SECRET:}
  bearer-only: true
  use-resource-role-mappings: true
  # Temporary: map Keycloak client roles to VIMP roles until the real roles exist ("KC_ROLE=APP_ROLE,...").
  role-aliases: ${KEYCLOAK_ROLE_ALIASES:DEVELOPER=PORTAL_ADMIN}

vimp:
  auth:
    # keycloak = tokens from Keycloak (use in every shared environment); local = dev login with demo users.
    mode: ${VIMP_AUTH_MODE:${VCRD_AUTH_MODE:local}}
  malware:
    # clamav = scan every upload with clamd (uploads refused if it is unreachable); disabled = local dev only.
    mode: ${VIMP_MALWARE_MODE:${VCRD_MALWARE_MODE:disabled}}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout: PT30S
  jwt:
    # Dev-only secret (min 32 chars). Override with VIMP_JWT_SECRET in any shared environment.
    secret: ${VIMP_JWT_SECRET:${VCRD_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}}
    expiry-minutes: 480
  storage:
    root: ${VIMP_STORAGE_ROOT:${VCRD_STORAGE_ROOT:./data/documents}}
  ocr:
    # Folder containing <language>.traineddata (e.g. C:/tessdata). Blank = OCR disabled;
    # digital PDFs still work, scanned ones are rejected with OCR_NOT_CONFIGURED.
    tessdata-path: ${VIMP_TESSDATA_PATH:${VCRD_TESSDATA_PATH:}}
    language: eng
  sap:
    # mock = in-memory sample POs and SAP invoice processing. Real gateway will be added once the SAP interface is confirmed.
    mode: mock
    # How long an uncertain SAP request may stay unconfirmed before "not found in SAP" is trusted and a retry allowed.
    reconcile-after: PT5M
  # Who performs which step. PROPOSED defaults: confirm with the business before go-live.
  workflow:
    zpark-roles: [PMO]
    miro-roles: [PMO, FINANCE]
    # In order. A level applies when invoice total >= min-amount. Nobody may approve two levels of one invoice.
    approval-levels:
      - name: Project approval
        roles: [APPROVER]
        min-amount: 0
      - name: Finance approval
        roles: [FINANCE]
        min-amount: 500000
  jobs:
    enabled: true
    invoice-interval: PT1M
    po-sync-interval: PT15M

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Local development without installing a database. Data persists in ./data
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/vcrd-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vcrd}
    username: ${DB_USERNAME:vcrd}
    password: ${DB_PASSWORD:vcrd}
